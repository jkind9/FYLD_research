plugins { id "com.android.application" }

android {
    namespace "org.fyld.rawrecorder"
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "org.fyld.rawrecorder"
        minSdk 26  // java.nio.file for the upload
        targetSdk 36
        versionCode 1
        versionName "0.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ARCore runs on the shared camera only to record its poses as the reference; the open stream does not need it.
    implementation "com.google.ar:core:1.56.0"
}
