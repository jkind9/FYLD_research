[project]
name = "sitescan"
version = "0.1.0"
description = "Room surfaces and site measures from a phone walk: learned depth scaled by ARCore, fused and cleaned."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4",
    "scipy>=1.17",
    "pillow>=12.3",
    "opencv-python>=5.0",
]

[project.optional-dependencies]
live = [
    "torch>=2.11",
    "torchvision>=0.26",
    "transformers>=5.14",
    "open3d>=0.19",
]
# Ultralytics is AGPL-3.0 or commercial; kept apart until its terms are settled (DESIGN.md 7.5).
objects = ["ultralytics"]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sitescan"]

[tool.uv]
# The versions that made the golden outputs. Raise one at a time and rerun pytest -m golden.
constraint-dependencies = [
    "numpy==2.4.2",
    "scipy==1.17.1",
    "pillow==12.3.0",
    "opencv-python==5.0.0.93",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.14.1",
    "open3d==0.19.0",
    "safetensors==0.8.0",
    "pytest==9.0.2",
    "ruff==0.16.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
