# Model weights used by the product code. The weights are local only; git keeps this list.
# Hashes are SHA-256 of the files as they sit today (9 November 2026). The paths move to models/ in phase 2.

[depth_anything_v2_metric_indoor_small]
role = "learned depth"
source = "https://huggingface.co/depth-anything/Depth-Anything-V2-Metric-Indoor-Small-hf"
revision = "not recorded at download"
weights_licence = "Apache-2.0 (Small model)"
runtime = "transformers 5.14.1, torch 2.11.0, CPU"
output = "metric depth in metres, indoor (Hypersim fine-tune); still needs the scale stage"
path = "data/models/depth_anything_v2_metric_indoor_small"
sha256."model.safetensors" = "e990eb82fbf11b05b7813261196a2b841bdcf5a05f64396724a8987fa90504a3"
