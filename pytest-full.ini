# Every test in the repository: product, evaluation, experiments and tools. The default lane is pytest.ini.
[pytest]
testpaths = tests research/evaluation research/experiments tools
pythonpath = research/experiments/06_object_recognition/src
addopts = -p no:cacheprovider --import-mode=importlib -m "not golden"
markers =
    golden: real stages on the fixture recording against saved outputs; run with -m golden
norecursedirs = .git .kilo .worktrees .venv data task_list third_party runs outputs models .pytest* pytest-cache-files-* .tmp_task*_pytest_* .task13_pytest_tmp_*
