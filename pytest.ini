# Product lane: sitescan and apps, under a minute. Everything else: pytest -c pytest-full.ini
[pytest]
testpaths = tests
addopts = -p no:cacheprovider --import-mode=importlib -m "not golden"
markers =
    golden: real stages on the fixture recording against saved outputs; run with -m golden
norecursedirs = .git .kilo .worktrees .venv archive data task_list third_party runs outputs models .pytest* pytest-cache-files-* .tmp_task*_pytest_* .task13_pytest_tmp_*
